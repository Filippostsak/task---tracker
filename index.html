<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Tracker – L'Oréal LDB</title>
<style>
 @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap');
 *{box-sizing:border-box;margin:0;padding:0}
 body{min-height:100vh;background:#0f0f14;font-family:'DM Sans','Segoe UI',sans-serif;color:#e2e8f0}
 ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:#1a1a24}::-webkit-scrollbar-thumb{background:#333;border-radius:2px}
/* HEADER */
.header{background:#13131c;border-bottom:1px solid #1e1e2e;padding:18px 28px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.header-left .badge{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.dot{width:8px;height:8px;border-radius:50%;background:#c8102e}
.brand{font-size:11px;color:#64748b;letter-spacing:.12em;text-transform:uppercase;font-family:‘DM Mono’,monospace}
.header h1{font-size:22px;font-weight:700;letter-spacing:-.02em}
.header-right{display:flex;align-items:center;gap:12px}
.month-summary{text-align:right}
.month-summary .label{font-size:11px;color:#64748b}
.month-summary .counts{font-size:13px;font-weight:600;margin-top:2px}
.btn-new{background:#c8102e;color:#fff;border:none;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:500;cursor:pointer;font-family:‘DM Sans’,sans-serif;transition:opacity .15s}
.btn-new:hover{opacity:.85}
/* DATA ACTIONS */
.data-bar{background:#13131c;border-bottom:1px solid #1e1e2e;padding:8px 28px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn-data{background:transparent;border:1px solid #1e1e2e;color:#64748b;padding:5px 14px;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;font-family:‘DM Sans’,sans-serif;transition:all .15s}
.btn-data:hover{background:#1e1e2e;color:#e2e8f0}
.btn-data.import{color:#60a5fa;border-color:#1e3a5f}
.btn-data.export{color:#10b981;border-color:#1e3d35}
.data-hint{font-size:11px;color:#334155;margin-left:4px}
/* MONTHS */
.month-nav{background:#13131c;border-bottom:1px solid #1e1e2e;padding:12px 28px;display:flex;align-items:center;gap:6px;overflow-x:auto}
.year-ctrl{display:flex;align-items:center;gap:4px;margin-right:8px}
.btn-year{background:none;border:none;cursor:pointer;color:#64748b;font-size:16px;padding:2px 6px;transition:color .15s}
.btn-year:hover{color:#e2e8f0}
.year-label{font-size:12px;color:#64748b;font-family:‘DM Mono’,monospace;min-width:36px}
.divider{width:1px;height:20px;background:#1e1e2e;margin:0 6px}
.month-tab{padding:6px 12px;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-family:‘DM Sans’,sans-serif;font-weight:500;background:transparent;color:#64748b;transition:all .15s;position:relative;white-space:nowrap}
.month-tab:hover{background:#2a2a38;color:#e2e8f0}
.month-tab.active{background:#c8102e;color:#fff}
.month-dot{position:absolute;top:2px;right:2px;width:5px;height:5px;border-radius:50%;background:#f59e0b}
/* MAIN */
.main{padding:24px 28px;max-width:900px;margin:0 auto}
.main-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.main-header h2{font-size:18px;font-weight:600}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filter-btn{padding:5px 14px;border-radius:20px;border:1px solid #1e1e2e;cursor:pointer;font-size:12px;font-family:‘DM Sans’,sans-serif;font-weight:500;background:transparent;color:#64748b;transition:all .15s}
.filter-btn:hover{opacity:.8}
.filter-btn.active-all{background:#334155;color:#e2e8f0;border-color:#334155}
.filter-btn.active-status{border-color:var(–sc)}
/* EMPTY */
.empty{text-align:center;padding:60px 20px;color:#334155}
.empty .icon{font-size:40px;margin-bottom:12px}
.empty .title{font-size:15px;font-weight:500;margin-bottom:6px;color:#334155}
.empty .sub{font-size:13px;color:#475569}
/* TASK CARD */
.tasks{display:flex;flex-direction:column;gap:10px}
.task-card{background:#13131c;border:1px solid #1e1e2e;border-radius:12px;overflow:hidden;transition:border-color .2s}
.task-card:hover{border-color:#2e2e42}
.task-header{padding:16px 18px;cursor:pointer;display:flex;align-items:center;gap:14px}
.progress-circle{position:relative;width:40px;height:40px;flex-shrink:0}
.progress-circle svg{transform:rotate(-90deg)}
.circle-bg{fill:none;stroke:#1e1e2e;stroke-width:3}
.circle-fill{fill:none;stroke-width:3;transition:stroke-dashoffset .4s ease}
.circle-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;font-family:‘DM Mono’,monospace}
.task-info{flex:1;min-width:0}
.task-title-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.task-title{font-size:14px;font-weight:600;color:#e2e8f0}
.tag{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:500}
.tag-cat{background:#1e2d3d;color:#60a5fa}
.tag-status{font-weight:600}
.progress-bar{height:3px;background:#1e1e2e;border-radius:2px;overflow:hidden;margin-bottom:4px}
.progress-fill{height:100%;border-radius:2px;transition:width .4s ease}
.task-meta{font-size:11px;color:#475569}
.task-actions{display:flex;gap:6px;flex-shrink:0}
.btn-action{background:#1e1e2e;border:none;cursor:pointer;padding:6px 10px;border-radius:8px;font-size:12px;transition:opacity .15s;font-family:‘DM Sans’,sans-serif}
.btn-action:hover{opacity:.75}
.btn-action.copy{color:#94a3b8}
.btn-action.edit{color:#94a3b8}
.btn-action.del{color:#ef4444}
.chevron{color:#334155;font-size:12px;flex-shrink:0;margin-left:4px}
/* STEPS */
.steps-section{border-top:1px solid #1e1e2e;padding:4px 18px 12px}
.step-row{display:flex;align-items:flex-start;gap:12px;padding:8px 6px;border-radius:6px;cursor:pointer;transition:background .1s}
.step-row:hover{background:rgba(255,255,255,.03)}
.checkbox{width:18px;height:18px;border-radius:4px;border:2px solid #334155;background:transparent;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.checkbox.checked{background:#10b981;border-color:#10b981}
.checkbox.checked::after{content:‘✓’;color:#fff;font-size:11px;font-weight:700}
.step-num{font-family:‘DM Mono’,monospace;font-size:10px;color:#334155;margin-right:2px}
.step-text{font-size:13px;line-height:1.5;flex:1}
.step-text.done{color:#475569;text-decoration:line-through}
.step-text.pending{color:#cbd5e1}
/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(4px)}
.modal{background:#13131c;border:1px solid #1e1e2e;border-radius:16px;padding:28px;width:480px;max-width:95vw;max-height:90vh;overflow-y:auto}
.modal h3{font-size:16px;font-weight:600;margin-bottom:20px}
.form-group{margin-bottom:14px}
.form-label{font-size:11px;color:#64748b;display:block;margin-bottom:4px;letter-spacing:.06em;text-transform:uppercase}
.form-row{display:flex;gap:10px}
.form-input{width:100%;background:#0f0f14;border:1px solid #1e1e2e;border-radius:8px;padding:10px 12px;color:#e2e8f0;font-size:14px;outline:none;font-family:‘DM Sans’,sans-serif;transition:border-color .15s}
.form-input:focus{border-color:#c8102e}
.status-row{display:flex;gap:6px;flex-wrap:wrap}
.btn-status{padding:6px 14px;border-radius:8px;font-size:12px;border:1px solid #1e1e2e;background:#0f0f14;cursor:pointer;font-family:‘DM Sans’,sans-serif;font-weight:500;transition:all .15s}
.steps-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.btn-add-step{background:#1e2d3d;color:#60a5fa;border:none;padding:4px 10px;border-radius:6px;font-size:11px;cursor:pointer;font-family:‘DM Sans’,sans-serif;font-weight:500}
.step-input-row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.step-num-label{font-size:10px;color:#334155;font-family:‘DM Mono’,monospace;width:20px;text-align:right}
.btn-move{background:#1e1e2e;color:#475569;border:none;padding:6px 8px;border-radius:6px;font-size:11px;cursor:pointer}
.btn-remove-step{background:#1e1e2e;color:#ef4444;border:none;padding:6px 8px;border-radius:6px;font-size:11px;cursor:pointer}
.modal-footer{display:flex;gap:8px;margin-top:24px}
.btn-cancel{flex:1;background:#1e1e2e;color:#94a3b8;border:none;padding:11px;border-radius:10px;font-size:13px;cursor:pointer;font-family:‘DM Sans’,sans-serif;font-weight:500}
.btn-save{flex:2;background:#c8102e;color:#fff;border:none;padding:11px;border-radius:10px;font-size:13px;cursor:pointer;font-family:‘DM Sans’,sans-serif;font-weight:500;transition:opacity .15s}
.btn-save:disabled{background:#1e1e2e;color:#475569;cursor:not-allowed}
.btn-save:not(:disabled):hover{opacity:.85}
/* COPY MODAL */
.copy-modal{width:340px}
.copy-modal p{font-size:13px;color:#64748b;margin-bottom:20px}
.copy-modal .note{font-size:12px;color:#475569;margin-bottom:20px}
/* NOTIF */
.notif{position:fixed;bottom:24px;right:24px;background:#1e2d3d;border:1px solid #10b981;color:#10b981;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:500;z-index:200;animation:slideUp .3s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<!-- HEADER -->
<div class="header">
<div class="header-left">
<div class="badge"><div class="dot"></div><span class="brand">L'Oréal LDB</span></div>
<h1>Task Tracker</h1>
</div>
<div class="header-right">
<div class="month-summary">
<div class="label">Αυτό τον μήνα</div>
<div class="counts" id="monthCounts"></div>
</div>
<button class="btn-new" onclick="openForm()">+ Νέο Task</button>
</div>
</div>
<!-- DATA BAR -->
<div class="data-bar">
<button class="btn-data export" onclick="exportData()">⬇ Export JSON</button>
<button class="btn-data import" onclick="document.getElementById('importFile').click()">⬆ Import JSON</button>
<input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
<span class="data-hint">💡 Κάνε Export τακτικά για backup</span>
</div>
<!-- MONTH NAV -->
<div class="month-nav">
<div class="year-ctrl">
<button class="btn-year" onclick="changeYear(-1)">‹</button>
<span class="year-label" id="yearLabel"></span>
<button class="btn-year" onclick="changeYear(1)">›</button>
</div>
<div class="divider"></div>
<div id="monthTabs"></div>
</div>
<!-- MAIN -->
<div class="main">
<div class="main-header">
<h2 id="mainTitle"></h2>
<div class="filters" id="filters"></div>
</div>
<div id="taskList"></div>
</div>
<!-- FORM MODAL -->
<div class="modal-overlay" id="formModal" style="display:none" onclick="closeFormIfOverlay(event)">
<div class="modal">
<h3 id="formTitle">Νέο Task</h3>
<div class="form-group">
<label class="form-label">Τίτλος *</label>
<input class="form-input" id="fTitle" placeholder="π.χ. Cycle 3 – Asset Translation">
</div>
<div class="form-row">
<div class="form-group" style="flex:1">
<label class="form-label">Κατηγορία</label>
<input class="form-input" id="fCategory" placeholder="π.χ. Content, Campaign…">
</div>
<div class="form-group" style="width:130px">
<label class="form-label">Deadline</label>
<input class="form-input" id="fDeadline" type="date">
</div>
</div>
<div class="form-group">
<label class="form-label">Status</label>
<div class="status-row" id="statusRow"></div>
</div>
<div class="form-group">
<div class="steps-header">
<label class="form-label" style="margin:0">Βήματα</label>
<button class="btn-add-step" onclick="addStepInput()">+ Βήμα</button>
</div>
<div id="stepInputs"></div>
</div>
<div class="modal-footer">
<button class="btn-cancel" onclick="closeForm()">Άκυρο</button>
<button class="btn-save" id="btnSave" onclick="saveTask()">Προσθήκη Task</button>
</div>
</div>
</div>
<!-- COPY MODAL -->
<div class="modal-overlay" id="copyModal" style="display:none" onclick="closeCopyIfOverlay(event)">
<div class="modal copy-modal">
<h3>Αντιγραφή Task</h3>
<p>Επίλεξε σε ποιον μήνα θέλεις να αντιγραφεί</p>
<div class="form-row">
<div class="form-group" style="flex:1">
<label class="form-label">Μήνας</label>
<select class="form-input" id="copyMonth"></select>
</div>
<div class="form-group" style="width:90px">
<label class="form-label">Έτος</label>
<input class="form-input" id="copyYear" type="number">
</div>
</div>
<p class="note">Τα βήματα θα αντιγραφούν ως αδοκίμαστα (unchecked)</p>
<div class="modal-footer">
<button class="btn-cancel" onclick="closeCopyModal()">Άκυρο</button>
<button class="btn-save" onclick="confirmCopy()">Αντιγραφή</button>
</div>
</div>
</div>
<script>
const MONTHS_SHORT = ["Ιαν","Φεβ","Μαρ","Απρ","Μαΐ","Ιουν","Ιουλ","Αυγ","Σεπ","Οκτ","Νοε","Δεκ"];
const MONTHS_FULL = ["Ιανουάριος","Φεβρουάριος","Μάρτιος","Απρίλιος","Μάιος","Ιούνιος","Ιούλιος","Αύγουστος","Σεπτέμβριος","Οκτώβριος","Νοέμβριος","Δεκέμβριος"];
const STATUS_LIST = ["Not Started","In Progress","Done","Blocked"];
const STATUS_COLORS = {"Not Started":"#94a3b8","In Progress":"#f59e0b","Done":"#10b981","Blocked":"#ef4444"};
const STORAGE_KEY = "loreal-tasktracker-v1";
let state = {
 year: new Date().getFullYear(),
 month: new Date().getMonth(),
 filter: "All",
 data: {},
 editingId: null,
 copyTaskId: null,
 formStatus: "Not Started",
 stepCounter: 0
};
function loadData() {
 try {
   const raw = localStorage.getItem(STORAGE_KEY);
   if (raw) state.data = JSON.parse(raw);
   else {
     const key = `${state.year}-${state.month}`;
     state.data[key] = [{
       id: "demo1", title: "Cycle 3 – Asset Translation & Upload", category: "Content",
       deadline: "", status: "In Progress", expanded: false,
       steps: [
         {id:"s1",text:"Ζητάω από PMs να φτιάξουν PPT με translations",done:true},
         {id:"s2",text:"Derivative assets από Opera σε ελληνικό φάκελο",done:true},
         {id:"s3",text:"Στέλνω assets στον Μπαλάσκα",done:false},
         {id:"s4",text:"Λαμβάνω επιβεβαίωση από Μπαλάσκα",done:false},
         {id:"s5",text:"Ανεβάζω assets στο Opera",done:false},
         {id:"s6",text:"Ενημερώνω PMs να κλείσουν tasks στο Salsify",done:false}
       ]
     }];
     saveData();
   }
 } catch(e) { state.data = {}; }
}
function saveData() {
 try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data)); } catch(e) {}
}
function getMonthKey(y, m) { return `${y}-${m}`; }
function currentKey() { return getMonthKey(state.year, state.month); }
function getTasks() { return state.data[currentKey()] || []; }
function setTasks(tasks) { state.data[currentKey()] = tasks; saveData(); }
function genId() { return "t" + Date.now() + Math.random().toString(36).slice(2,6); }
function genStepId() { return "s" + Date.now() + Math.random().toString(36).slice(2,6); }
function progress(task) {
 if (!task.steps.length) return 0;
 return Math.round(task.steps.filter(s => s.done).length / task.steps.length * 100);
}
// ─── RENDER ───────────────────────────────────────────────────────────────────
function render() {
 renderYearLabel();
 renderMonthTabs();
 renderMainHeader();
 renderFilters();
 renderTasks();
 renderMonthCounts();
}
function renderYearLabel() {
 document.getElementById("yearLabel").textContent = state.year;
}
function renderMonthTabs() {
 const container = document.getElementById("monthTabs");
 container.innerHTML = "";
 MONTHS_SHORT.forEach((m, i) => {
   const key = getMonthKey(state.year, i);
   const count = (state.data[key] || []).length;
   const isActive = i === state.month;
   const btn = document.createElement("button");
   btn.className = "month-tab" + (isActive ? " active" : "");
   btn.textContent = m;
   btn.onclick = () => { state.month = i; state.filter = "All"; render(); };
   if (count > 0 && !isActive) {
     const dot = document.createElement("span");
     dot.className = "month-dot";
     btn.appendChild(dot);
   }
   container.appendChild(btn);
 });
}
function renderMainHeader() {
 document.getElementById("mainTitle").textContent = `${MONTHS_FULL[state.month]} ${state.year}`;
}
function renderMonthCounts() {
 const tasks = getTasks();
 const done = tasks.filter(t => t.status === "Done").length;
 const inProg = tasks.filter(t => t.status === "In Progress").length;
 let html = `<span style="color:#10b981">${done} done</span>`;
 if (inProg > 0) html += ` <span style="color:#f59e0b;margin-left:8px">${inProg} σε εξέλιξη</span>`;
 if (done === 0 && inProg === 0) html = `<span style="color:#334155">${tasks.length} tasks</span>`;
 document.getElementById("monthCounts").innerHTML = html;
}
function renderFilters() {
 const container = document.getElementById("filters");
 const options = ["All", ...STATUS_LIST];
 container.innerHTML = options.map(s => {
   const isActive = state.filter === s;
   const color = s === "All" ? null : STATUS_COLORS[s];
   let style = "";
   if (isActive && s === "All") style = `background:#334155;color:#e2e8f0;border-color:#334155`;
   else if (isActive) style = `background:${color}22;color:${color};border-color:${color}55`;
   const label = s === "All" ? "Όλα" : s;
   return `<button class="filter-btn${isActive ? (s==="All"?" active-all":" active-status") : ""}" style="${style}" onclick="setFilter('${s}')">${label}</button>`;
 }).join("");
}
function renderTasks() {
 const container = document.getElementById("taskList");
 const tasks = getTasks();
 const filtered = state.filter === "All" ? tasks : tasks.filter(t => t.status === state.filter);
 if (filtered.length === 0) {
   container.innerHTML = `<div class="empty"><div class="icon">📋</div><div class="title">Δεν υπάρχουν tasks</div><div class="sub">Πρόσθεσε ένα νέο task για να ξεκινήσεις</div></div>`;
   return;
 }
 container.innerHTML = `<div class="tasks">${filtered.map(t => renderTaskCard(t)).join("")}</div>`;
}
function renderTaskCard(task) {
 const pct = progress(task);
 const color = STATUS_COLORS[task.status] || "#94a3b8";
 const r = 16;
 const circ = 2 * Math.PI * r;
 const offset = circ * (1 - pct / 100);
 const doneSteps = task.steps.filter(s => s.done).length;
 const deadlineHtml = task.deadline ? `<span style="margin-left:10px">📅 ${formatDate(task.deadline)}</span>` : "";
 const stepsHtml = task.expanded ? `
<div class="steps-section">
     ${task.steps.map((step, idx) => `
<div class="step-row" onclick="toggleStep('${task.id}','${step.id}')">
<div class="checkbox${step.done ? " checked" : ""}"></div>
<span class="step-text ${step.done ? "done" : "pending"}">
<span class="step-num">${String(idx+1).padStart(2,"0")} </span>${escHtml(step.text)}
</span>
</div>
     `).join("")}
</div>` : "";
 return `
<div class="task-card" id="card-${task.id}">
<div class="task-header" onclick="toggleExpand('${task.id}')">
<div class="progress-circle">
<svg width="40" height="40">
<circle class="circle-bg" cx="20" cy="20" r="${r}"/>
<circle class="circle-fill" cx="20" cy="20" r="${r}"
             stroke="${color}"
             stroke-dasharray="${circ}"
             stroke-dashoffset="${offset}"/>
</svg>
<div class="circle-pct" style="color:${color}">${pct}%</div>
</div>
<div class="task-info">
<div class="task-title-row">
<span class="task-title">${escHtml(task.title)}</span>
           ${task.category ? `<span class="tag tag-cat">${escHtml(task.category)}</span>` : ""}
<span class="tag tag-status" style="background:${color}18;color:${color}">${task.status}</span>
</div>
<div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${color}"></div></div>
<div class="task-meta">${doneSteps}/${task.steps.length} βήματα${deadlineHtml}</div>
</div>
<div class="task-actions" onclick="event.stopPropagation()">
<button class="btn-action copy" title="Αντιγραφή σε άλλο μήνα" onclick="openCopyModal('${task.id}')">⎘</button>
<button class="btn-action edit" title="Επεξεργασία" onclick="openForm('${task.id}')">✎</button>
<button class="btn-action del" title="Διαγραφή" onclick="deleteTask('${task.id}')">✕</button>
</div>
<div class="chevron">${task.expanded ? "▲" : "▼"}</div>
</div>
     ${stepsHtml}
</div>`;
}
function formatDate(d) {
 if (!d) return "";
 const [y,m,day] = d.split("-");
 return `${day}/${m}/${y}`;
}
function escHtml(s) {
 return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
// ─── ACTIONS ──────────────────────────────────────────────────────────────────
function setFilter(f) { state.filter = f; render(); }
function changeYear(d) { state.year += d; render(); }
function toggleExpand(id) {
 const tasks = getTasks();
 const t = tasks.find(t => t.id === id);
 if (t) t.expanded = !t.expanded;
 setTasks(tasks);
 render();
}
function toggleStep(taskId, stepId) {
 const tasks = getTasks();
 const task = tasks.find(t => t.id === taskId);
 if (!task) return;
 const step = task.steps.find(s => s.id === stepId);
 if (!step) return;
 step.done = !step.done;
 const allDone = task.steps.every(s => s.done);
 const anyDone = task.steps.some(s => s.done);
 if (allDone) task.status = "Done";
 else if (anyDone && task.status !== "Blocked") task.status = "In Progress";
 else if (!anyDone && task.status === "Done") task.status = "In Progress";
 setTasks(tasks);
 render();
}
function deleteTask(id) {
 if (!confirm("Διαγραφή task;")) return;
 setTasks(getTasks().filter(t => t.id !== id));
 render();
 showNotif("Task διαγράφηκε");
}
// ─── FORM ──────────────────────────────────────────────────────────────────────
function openForm(editId) {
 state.editingId = editId || null;
 const modal = document.getElementById("formModal");
 modal.style.display = "flex";
 let task = null;
 if (editId) task = getTasks().find(t => t.id === editId);
 document.getElementById("formTitle").textContent = task ? "Επεξεργασία Task" : "Νέο Task";
 document.getElementById("btnSave").textContent = task ? "Αποθήκευση" : "Προσθήκη Task";
 document.getElementById("fTitle").value = task ? task.title : "";
 document.getElementById("fCategory").value = task ? task.category : "";
 document.getElementById("fDeadline").value = task ? task.deadline : "";
 state.formStatus = task ? task.status : "Not Started";
 renderStatusRow();
 const stepInputs = document.getElementById("stepInputs");
 stepInputs.innerHTML = "";
 state.stepCounter = 0;
 const steps = task ? task.steps : [{ id: genStepId(), text: "", done: false }];
 steps.forEach(s => addStepInput(s.text, s.id, s.done));
 document.getElementById("fTitle").oninput = updateSaveBtn;
 updateSaveBtn();
}
function renderStatusRow() {
 const container = document.getElementById("statusRow");
 container.innerHTML = STATUS_LIST.map(s => {
   const color = STATUS_COLORS[s];
   const active = state.formStatus === s;
   return `<button class="btn-status" onclick="setFormStatus('${s}')" style="${active ? `background:${color}25;color:${color};border-color:${color}55` : ""}">${s}</button>`;
 }).join("");
}
function setFormStatus(s) { state.formStatus = s; renderStatusRow(); }
function addStepInput(text, id, done) {
 text = text || "";
 id = id || genStepId();
 state.stepCounter++;
 const container = document.getElementById("stepInputs");
 const div = document.createElement("div");
 div.className = "step-input-row";
 div.dataset.stepId = id;
 div.dataset.stepDone = done ? "1" : "0";
 div.innerHTML = `
<span class="step-num-label">${state.stepCounter}.</span>
<input class="form-input" placeholder="Βήμα..." value="${escHtml(text)}" style="flex:1">
<button class="btn-move" onclick="moveStepInput(this,-1)">↑</button>
<button class="btn-move" onclick="moveStepInput(this,1)">↓</button>
<button class="btn-remove-step" onclick="removeStepInput(this)">✕</button>`;
 container.appendChild(div);
 renumberSteps();
}
function moveStepInput(btn, dir) {
 const row = btn.closest(".step-input-row");
 const parent = row.parentNode;
 const rows = Array.from(parent.children);
 const idx = rows.indexOf(row);
 const newIdx = idx + dir;
 if (newIdx < 0 || newIdx >= rows.length) return;
 if (dir === -1) parent.insertBefore(row, rows[newIdx]);
 else parent.insertBefore(rows[newIdx], row);
 renumberSteps();
}
function removeStepInput(btn) {
 btn.closest(".step-input-row").remove();
 renumberSteps();
}
function renumberSteps() {
 document.querySelectorAll("#stepInputs .step-input-row").forEach((row, i) => {
   row.querySelector(".step-num-label").textContent = (i + 1) + ".";
 });
}
function updateSaveBtn() {
 document.getElementById("btnSave").disabled = !document.getElementById("fTitle").value.trim();
}
function saveTask() {
 const title = document.getElementById("fTitle").value.trim();
 if (!title) return;
 const category = document.getElementById("fCategory").value.trim();
 const deadline = document.getElementById("fDeadline").value;
 const stepRows = document.querySelectorAll("#stepInputs .step-input-row");
 const steps = Array.from(stepRows).map(row => ({
   id: row.dataset.stepId,
   text: row.querySelector("input").value.trim(),
   done: row.dataset.stepDone === "1"
 })).filter(s => s.text);
 const tasks = getTasks();
 if (state.editingId) {
   const idx = tasks.findIndex(t => t.id === state.editingId);
   if (idx >= 0) {
     tasks[idx] = { ...tasks[idx], title, category, deadline, status: state.formStatus, steps };
   }
   showNotif("Task ενημερώθηκε ✓");
 } else {
   tasks.push({ id: genId(), title, category, deadline, status: state.formStatus, steps, expanded: false });
   showNotif("Task προστέθηκε ✓");
 }
 setTasks(tasks);
 closeForm();
 render();
}
function closeForm() {
 document.getElementById("formModal").style.display = "none";
 state.editingId = null;
}
function closeFormIfOverlay(e) {
 if (e.target === document.getElementById("formModal")) closeForm();
}
// ─── COPY MODAL ───────────────────────────────────────────────────────────────
function openCopyModal(taskId) {
 state.copyTaskId = taskId;
 const nextMonth = (state.month + 1) % 12;
 const nextYear = state.month === 11 ? state.year + 1 : state.year;
 const sel = document.getElementById("copyMonth");
 sel.innerHTML = MONTHS_FULL.map((m, i) => `<option value="${i}">${m}</option>`).join("");
 sel.value = nextMonth;
 document.getElementById("copyYear").value = nextYear;
 document.getElementById("copyModal").style.display = "flex";
}
function closeCopyModal() {
 document.getElementById("copyModal").style.display = "none";
 state.copyTaskId = null;
}
function closeCopyIfOverlay(e) {
 if (e.target === document.getElementById("copyModal")) closeCopyModal();
}
function confirmCopy() {
 const targetMonth = parseInt(document.getElementById("copyMonth").value);
 const targetYear = parseInt(document.getElementById("copyYear").value);
 const allTasks = getTasks();
 const task = allTasks.find(t => t.id === state.copyTaskId);
 if (!task) return;
 const targetKey = getMonthKey(targetYear, targetMonth);
 const copied = {
   ...task,
   id: genId(),
   expanded: false,
   status: "Not Started",
   steps: task.steps.map(s => ({ ...s, id: genStepId(), done: false }))
 };
 if (!state.data[targetKey]) state.data[targetKey] = [];
 state.data[targetKey].push(copied);
 saveData();
 closeCopyModal();
 render();
 showNotif(`Αντιγράφηκε στον ${MONTHS_FULL[targetMonth]} ✓`);
}
// ─── EXPORT / IMPORT ──────────────────────────────────────────────────────────
function exportData() {
 const json = JSON.stringify(state.data, null, 2);
 const blob = new Blob([json], { type: "application/json" });
 const url = URL.createObjectURL(blob);
 const a = document.createElement("a");
 const today = new Date().toISOString().slice(0, 10);
 a.href = url;
 a.download = `tasktracker-backup-${today}.json`;
 a.click();
 URL.revokeObjectURL(url);
 showNotif("Backup αποθηκεύτηκε ✓");
}
function importData(event) {
 const file = event.target.files[0];
 if (!file) return;
 const reader = new FileReader();
 reader.onload = (e) => {
   try {
     const parsed = JSON.parse(e.target.result);
     if (confirm("Θέλεις να αντικαταστήσεις όλα τα δεδομένα με αυτό το backup;")) {
       state.data = parsed;
       saveData();
       render();
       showNotif("Δεδομένα φορτώθηκαν ✓");
     }
   } catch {
     alert("Μη έγκυρο αρχείο JSON.");
   }
 };
 reader.readAsText(file);
 event.target.value = "";
}
// ─── NOTIFICATION ─────────────────────────────────────────────────────────────
let notifTimeout;
function showNotif(msg) {
 clearTimeout(notifTimeout);
 let el = document.querySelector(".notif");
 if (el) el.remove();
 el = document.createElement("div");
 el.className = "notif";
 el.textContent = msg;
 document.body.appendChild(el);
 notifTimeout = setTimeout(() => el && el.remove(), 2500);
}
// ─── INIT ─────────────────────────────────────────────────────────────────────
loadData();
render();
</script>
</body>
